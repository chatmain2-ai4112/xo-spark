  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark"><span>X</span><span>O</span></div><div><p class="eyebrow">Neon Tic-Tac-Toe</p><h1>XO Spark</h1></div></div>
      <div class="actions"><button class="icon-btn" id="themeToggle" aria-label="Choose theme">◐</button><button class="icon-btn" id="resetScores" aria-label="Reset scores">↺</button></div>
    </header>
    <div class="theme-panel" id="themePanel" aria-label="Themes">
      <div class="theme-grid" id="themeGrid"></div>
    </div>
    <nav class="mode-tabs" aria-label="Game mode"><button class="tab active" data-mode="pvp">2 Players</button><button class="tab" data-mode="cpu">vs Computer</button></nav>
    <section class="scoreboard" aria-label="Scoreboard"><div class="score x current" id="scoreX"><span class="score-label" id="scoreXLabel">Player X</span><span class="score-value">0</span></div><div class="score"><span class="score-label">Draws</span><span class="score-value" id="drawValue">0</span></div><div class="score o" id="scoreO"><span class="score-label" id="scoreOLabel">Player O</span><span class="score-value">0</span></div></section>
    <section class="arena">
      <div><p class="status" id="status">Player <strong>X</strong>'s turn</p><div class="board" id="board" role="grid" aria-label="Tic-Tac-Toe board"></div><div class="kural-card" id="kuralCard" data-language="tamil"><div class="kural-heading"><span>Thirukkural · <span id="kuralNumber">1</span>/1330<span class="kural-source" id="kuralSource"></span></span><div class="kural-fonts"><select id="kuralLanguage" aria-label="Thirukkural language"><option value="tamil">தமிழ் / Tamil</option><option value="english">English</option></select></div></div><div class="kural-text kural-lines" id="kuralText"></div><div class="kural-meaning kural-meaning-lines" id="kuralMeaning"></div></div></div>
      <aside class="side-card"><h2>Make your move</h2><p>Connect three symbols in a row to win the round.</p>
        <div class="identity-row" id="identityRow"><div class="identity-copy"><span class="identity-label">Player</span><span class="identity-name" id="identityName">Player</span></div><button class="edit-name" id="editName" type="button" aria-label="Edit player name">✎</button></div>
        <div class="control-row name-editor" id="nameEditor"><input class="name-input" id="playerName" maxlength="16" placeholder="Your name"><button class="edit-name" id="saveName" type="button" aria-label="Save player name">✓</button></div>
        <div class="control-row" id="difficultyRow"><label for="difficulty">AI</label><select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></div>
        <button class="action-btn" id="newGame">New round <span>→</span></button></aside>
    </section>
    <footer class="game-footer"><span>Best of luck, have fun.</span><span>Wins vs CPU: <b id="leaderboard">0</b></span><button class="text-btn" id="clearBoard">Clear board</button></footer>
  </main>
  <script>
    const KURAL_URL = window.XO_KURAL_URL || ((location.hostname === "localhost" || location.hostname === "127.0.0.1") ? "http://localhost:3000/api/kural" : null);
    const THEMES = [
      { id: "aurora", label: "Aurora" }, { id: "ember", label: "Ember" }, { id: "ocean", label: "Ocean" }, { id: "mono", label: "Mono" },
      { id: "christmas", label: "Christmas" }, { id: "easter", label: "Easter" }, { id: "halloween", label: "Halloween" },
      { id: "thanksgiving", label: "Thanksgiving" }, { id: "newyear", label: "New Year" }, { id: "valentine", label: "Valentine" },
      { id: "diwali", label: "Diwali" }, { id: "holi", label: "Holi" }, { id: "navratri", label: "Navratri" }, { id: "pongal", label: "Pongal" }, { id: "lohri", label: "Lohri" }
    ];
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    const state = { board:Array(9).fill(""), player:"X", active:true, mode:"pvp", scores:{X:0,O:0,draw:0}, first:"X", line:null, announcement:"", name:"" };
    const kurals = [
      [1, "அகர முதல எழுத்தெல்லாம் ஆதி\nபகவன் முதற்றே உலகு", "எழுத்துகளுக்கு அகரம் முதல்வனாக இருப்பது போல, உலகிற்கு இறைவன் முதல்வன்."],
      [2, "கற்றதனால் ஆய பயனென்கொல் வாலறிவன்\nநற்றாள் தொழாஅர் எனின்", "கற்ற கல்வியின் பயன், அறிவின் தலைவனின் திருவடிகளை வணங்காமல் இருந்தால் என்ன?"],
      [3, "மலர்மிசை ஏகினான் மாணடி சேர்ந்தார்\nநிலமிசை நீடுவாழ் வார்", "இறைவனின் சிறந்த அடிகளைச் சேர்ந்தோர் நீண்ட நல்வாழ்வு வாழ்வர்."],
      [4, "வேண்டுதல் வேண்டாமை இலானடி சேர்ந்தார்க்கு\nயாண்டும் இடும்பை இல", "விருப்பு வெறுப்பு இல்லாத இறைவனின் அடிகளைச் சேர்ந்தவர்க்கு துன்பம் இல்லை."],
      [5, "இருள்சேர் இருவினையும் சேரா இறைவன்\nபொருள்சேர் புகழ்புரிந்தார் மாட்டு", "இறைவனின் உண்மைப் புகழை விரும்புவோரிடம் நல்வினை தீவினை இரண்டும் சேராது."],
      [6, "பொறிவாயில் ஐந்தவித்தான் பொய்தீர் ஒழுக்க\nநெறிநின்றார் நீடுவாழ் வார்", "ஐம்புலன்களையும் அடக்கிய தூய ஒழுக்கத்தில் நிற்பவர் நீண்ட நல்வாழ்வு வாழ்வர்."],
      [7, "தனக்குவமை இல்லாதான் தாள்சேர்ந்தார்க் கல்லால்\nமனக்கவலை மாற்றல் அரிது", "ஒப்பற்ற இறைவனின் அடிகளைச் சேராதவர்க்கு மனக்கவலையை நீக்குதல் அரிது."],
      [8, "அறவாழி அந்தணன் தாள்சேர்ந்தார்க் கல்லால்\nபிறவாழி நீந்தல் அரிது", "அறக்கடலான இறைவனின் அடிகளைச் சேர்ந்தாலன்றி பிறவிக் கடலைக் கடப்பது அரிது."],
      [9, "கோளில் பொறியில் குணமிலவே எண்குணத்தான்\nதாளை வணங்காத் தலை", "எட்டு குணங்களுடைய இறைவனின் அடிகளை வணங்காத தலை பயனற்றது."],
      [10, "பிறவிப் பெருங்கடல் நீந்துவர் நீந்தார்\nஇறைவன் அடிசேரா தார்", "இறைவனின் அடிகளைச் சேர்ந்தவரே பிறவிக் கடலைக் கடக்க முடியும்."]
    ];
    const englishKurals = {
      1:["A, as its first of letters, every speech maintains;\nThe Primal Deity is first through all the world's domains.","As A is first among letters, so God is first in the world."],
      2:["No fruit have men of all their studied lore,\nSave they the Purely Wise One's feet adore.","Learning bears no fruit without reverence for perfect wisdom."],
      3:["His feet, who in the lovely flower hath blossomed, rest;\nWho gain in bliss through all the world are blest.","Those who follow divine wisdom live with lasting goodness."],
      4:["His foot, whom want affects not, irks not grief,\nWho gain thereby shall never be distressed.","Freedom from desire and hatred leads beyond suffering."],
      5:["The men who on the Purely Wise One's glorious feet\nFix firm their hold, shall find their feet from sin set free.","Those who honor truth rise beyond harmful attachments."],
      6:["Who stand in virtue's ways, the five restraining,\nLong live on earth, all faultless life maintaining.","Self-control and pure conduct bring a worthy life."],
      7:["To those who gain the feet of the Incomparable One,\n'Tis hard for mind's distress to find a place.","True wisdom gives strength against mental sorrow."],
      8:["Unless they gain the feet of Him the sea of virtue,\nNone can swim the sea of births, so hard to cross.","Clinging to virtue helps one cross the sea of life."],
      9:["The head that bows not to the feet of Him of eight virtues,\nIs like a head that cannot serve its use.","A life without humility before virtue is empty."],
      10:["The great sea of births they swim who cling to His feet;\nThe rest shall find the sea impossible to cross.","Devotion to the highest good carries one beyond life's struggles."]
    };
    let aiTimer = null, roundToken = 0, lastKuralNumber = 0;
    const $ = s => document.querySelector(s), boardEl=$("#board"), statusEl=$("#status"), scoreX=$("#scoreX .score-value"), scoreO=$("#scoreO .score-value"), drawValue=$("#drawValue");
    let computerWins = Number(localStorage.getItem("xo-computer-wins") || 0); $("#leaderboard").textContent = computerWins;
    state.name = localStorage.getItem("xo-name") || "Player"; $("#playerName").value = state.name; $("#identityName").textContent = state.name;
    function saveName() { state.name = $("#playerName").value.trim().slice(0,16) || "Player"; $("#playerName").value = state.name; $("#identityName").textContent = state.name; localStorage.setItem("xo-name", state.name); $("#nameEditor").classList.remove("open"); render(); }
    $("#editName").onclick=()=>{ $("#playerName").value=state.name; $("#nameEditor").classList.add("open"); $("#playerName").focus(); };
    $("#saveName").onclick=saveName;
    function splitAtWord(text, parts) {
      const words=String(text||"").trim().split(/\s+/).filter(Boolean), result=[];
      for(let i=0;i<parts;i++) {
        const start=Math.floor(i*words.length/parts), end=Math.floor((i+1)*words.length/parts);
        result.push(words.slice(start,end).join(" "));
      }
      return result;
    }
    function setKuralLines(id, text, count) {
      const target=$("#"+id), source=String(text||"").split(/\r?\n/).map(line=>line.trim()).filter(Boolean);
      const lines=id==="kuralText" ? (source.length>=2 ? source.slice(0,2) : splitAtWord(source.join(" "),2)) : splitAtWord(source.join(" "),count);
      target.innerHTML="";
      for(let i=0;i<count;i++) {
        const line=document.createElement("span"); line.className=id==="kuralText"?"kural-line":"kural-meaning-line"; line.textContent=lines[i]||"\u00a0"; target.appendChild(line);
      }
    }
    let currentKural = { tamilVerse:"", tamilMeaning:"", englishVerse:"", englishMeaning:"" };
    function renderKuralLanguage() {
      const english=$("#kuralLanguage").value==="english";
      $("#kuralCard").dataset.language=english?"english":"tamil";
      $("#kuralSource").textContent=english?"English: G. U. Pope (public domain)":"Tamil original";
      setKuralLines("kuralText",english?currentKural.englishVerse:currentKural.tamilVerse,2);
      setKuralLines("kuralMeaning",english?currentKural.englishMeaning:currentKural.tamilMeaning,3);
    }
    async function showKural() {
      let number=1+Math.floor(Math.random()*1330);
      while(number===lastKuralNumber) number=1+Math.floor(Math.random()*1330);
      lastKuralNumber=number;
      $("#kuralNumber").textContent=number; currentKural={tamilVerse:"Loading Thirukkural...",tamilMeaning:"",englishVerse:"Loading Thirukkural...",englishMeaning:""}; renderKuralLanguage();
      try {
        if(!KURAL_URL) throw new Error("Kural endpoint not configured");
        const response=await fetch(`${KURAL_URL}?num=${number}`);
        if(!response.ok) throw new Error("Thirukkural request failed");
        const remote=await response.json();
        currentKural.tamilVerse=[remote.line1,remote.line2].filter(Boolean).join("\n");
        currentKural.tamilMeaning=remote.tam_exp||"";
        currentKural.englishVerse=[remote.line1_eng,remote.line2_eng,remote.english_line1,remote.english_line2].filter(Boolean).slice(0,2).join("\n");
        currentKural.englishMeaning=remote.eng_exp||remote.en_exp||remote.english_exp||remote.meaning||"";
        const official=englishKurals[number];
        if(official) {
          currentKural.englishVerse=official[0]; currentKural.englishMeaning=official[1];
        } else if(!currentKural.englishVerse||!currentKural.englishMeaning) {
          currentKural.englishVerse="Thirukkural "+number; currentKural.englishMeaning="English translation will appear when the official text service is connected.";
        }
        renderKuralLanguage();
      } catch {
        let fallback=kurals[Math.floor(Math.random()*kurals.length)];
        if(kurals.length>1) while(fallback[0]===lastKuralNumber) fallback=kurals[Math.floor(Math.random()*kurals.length)];
        lastKuralNumber=fallback[0]; $("#kuralNumber").textContent=fallback[0]; const english=englishKurals[fallback[0]]||["Thirukkural "+fallback[0],"English translation from the public-domain G. U. Pope edition."]; currentKural={tamilVerse:fallback[1],tamilMeaning:fallback[2],englishVerse:english[0],englishMeaning:english[1]}; renderKuralLanguage();
      }
    }
    function result(board, mark) { return wins.find(line => line.every(i => board[i] === mark)); }
    function render() {
      boardEl.innerHTML = ""; state.board.forEach((value,i) => { const c=document.createElement("button"); c.className="cell "+(value?value.toLowerCase():""); c.disabled=Boolean(value)||!state.active||(state.mode==="cpu"&&state.player==="O"); c.setAttribute("role","gridcell"); c.setAttribute("aria-label",value?`Cell ${i+1}, ${value}`:`Empty cell ${i+1}`); c.textContent=value; c.onclick=()=>move(i); boardEl.appendChild(c); });
      scoreX.textContent=state.scores.X; scoreO.textContent=state.scores.O; drawValue.textContent=state.scores.draw; $("#scoreX").classList.toggle("current",state.active&&state.player==="X"); $("#scoreO").classList.toggle("current",state.active&&state.player==="O");
      const cpu=state.mode==="cpu"; $("#scoreXLabel").textContent=cpu?state.name:"Player X"; $("#scoreOLabel").textContent=cpu?"Computer":"Player O";
      if(state.active) {
        const turnName=state.mode==="cpu"?(state.player==="X"?state.name:"Computer"):`Player ${state.player}`;
        statusEl.innerHTML=state.announcement||`<strong>${turnName}</strong>'s turn`;
      }
    }
    function finish(text,line) { state.active=false; state.line=line; statusEl.innerHTML=text; render(); if(line) [...boardEl.children].forEach((c,i)=>{if(line.includes(i))c.classList.add("winner");}); showKural(); }
    function move(index, remote, fromComputer) {
      if(!state.active||state.board[index]||(!fromComputer&&state.mode==="cpu"&&state.player==="O")) return;
      state.announcement="";
      state.board[index]=state.player; const line=result(state.board,state.player);
      if(line){ state.scores[state.player]++; if(state.mode==="cpu"&&state.player==="X"){computerWins++;localStorage.setItem("xo-computer-wins",computerWins);$("#leaderboard").textContent=computerWins;} finish(`<strong>${state.player}</strong> wins the round!`,line); return; }
      if(state.board.every(Boolean)){state.scores.draw++;finish("It's a draw — well played!",null);return;}
      state.player=state.player==="X"?"O":"X"; render(); if(state.mode==="cpu"&&state.player==="O"){const token=roundToken;aiTimer=setTimeout(()=>{if(token===roundToken)computerMove();},420);}
    }
    function minimax(board, turn, depth, maxDepth) {
      if(result(board,"O")) return 10-depth; if(result(board,"X")) return depth-10; if(board.every(Boolean)||depth>=maxDepth) return 0;
      const vals=[]; board.forEach((v,i)=>{if(!v){board[i]=turn;vals.push({i,score:minimax(board,turn==="O"?"X":"O",depth+1,maxDepth)});board[i]="";}});
      return turn==="O"?Math.max(...vals.map(x=>x.score)):Math.min(...vals.map(x=>x.score));
    }
    function computerMove() {
      if(!state.active||state.player!=="O") return;
      const free=state.board.map((v,i)=>v?null:i).filter(i=>i!==null);
      if(!free.length) return;
      const difficulty=$("#difficulty").value;
      let pick=free[Math.floor(Math.random()*free.length)];
      const tactical=(mark)=>wins.map(line=>{const values=line.map(i=>state.board[i]);return values.filter(v=>v===mark).length===2&&values.includes("")?line[values.indexOf("")]:-1;}).find(i=>i>=0);
      if(difficulty==="easy"&&Math.random()<.72){ move(pick,false,true); return; }
      const forced=tactical("O") ?? tactical("X");
      if(forced!==undefined){ move(forced,false,true); return; }
      if(difficulty!=="easy"){
        const depth=difficulty==="hard"?9:4;
        let best=-Infinity;
        free.forEach(i=>{state.board[i]="O";const score=minimax(state.board,"X",0,depth);state.board[i]="";if(score>best){best=score;pick=i;}});
        if(difficulty==="medium"&&Math.random()<.16) pick=free[Math.floor(Math.random()*free.length)];
      }
      move(pick,false,true);
    }
    function resetRound() {
      clearTimeout(aiTimer); roundToken++;
      const myToken=roundToken;
      state.board=Array(9).fill(""); state.active=true; state.line=null;
      if(state.mode==="cpu"){ state.first=Math.random()<.5?"X":"O"; state.player=state.first; state.announcement=`Random start: <strong>${state.first}</strong> goes first.`; }
      else { state.first="X"; state.player="X"; state.announcement="Round reset."; }
      render();
      if(state.mode==="cpu"&&state.player==="O") setTimeout(()=>{ if(myToken===roundToken) computerMove(); }, 0);
    }
    function setupMode() {
      const isCpu=state.mode==="cpu";
      $(".side-card").classList.toggle("cpu-compact", isCpu);
      $("#identityRow").style.display="flex";
      $("#nameEditor").classList.remove("open");
      $("#difficultyRow").style.display=isCpu?"flex":"none";
    }
    $("#kuralLanguage").onchange=renderKuralLanguage;
    $("#newGame").onclick=resetRound; $("#clearBoard").onclick=resetRound; $("#resetScores").onclick=()=>{state.scores={X:0,O:0,draw:0};computerWins=0;localStorage.setItem("xo-computer-wins",0);$("#leaderboard").textContent=0;resetRound();};
    document.querySelectorAll(".tab").forEach(tab=>tab.onclick=()=>{state.mode=tab.dataset.mode;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===tab));setupMode();resetRound();});
    const panel=$("#themePanel"); $("#themeToggle").onclick=()=>panel.classList.toggle("open");
    const themeGrid=$("#themeGrid");
    THEMES.forEach((t,i)=>{ const dot=document.createElement("button"); dot.className="theme-dot"+(i===0?" active":""); dot.dataset.theme=t.id; dot.setAttribute("aria-label",t.label+" theme"); dot.title=t.label; dot.onclick=()=>{ document.body.dataset.theme=t.id; document.querySelectorAll(".theme-dot").forEach(d=>d.classList.toggle("active",d===dot)); panel.classList.remove("open"); }; themeGrid.appendChild(dot); });
    setupMode(); resetRound(); showKural();
  </script>
</body>
</html>
